[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whymatched"
version = "0.1.0"
description = "Why did this chunk match? Token-level attribution, negation/near-synonym collapse detection, and embedding-space visualization for retrieval debugging."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Zimnicki" }]
keywords = ["embeddings", "retrieval", "rag", "interpretability", "attribution", "vector-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23",
    "scikit-learn>=1.2",
]

[project.optional-dependencies]
local = [
    "torch>=2.0",
    "transformers>=4.35",
    "sentence-transformers>=2.3",
    "captum>=0.7",
]
openai = ["openai>=1.0"]
cohere = ["cohere>=5.0"]
voyage = ["voyageai>=0.2"]
viz = ["umap-learn>=0.5"]
all = [
    "torch>=2.0",
    "transformers>=4.35",
    "sentence-transformers>=2.3",
    "captum>=0.7",
    "openai>=1.0",
    "cohere>=5.0",
    "voyageai>=0.2",
    "umap-learn>=0.5",
]

[project.scripts]
whymatched = "whymatched.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whymatched = ["data/*.json", "data/*.txt", "report/*.html"]
