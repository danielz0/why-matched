name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: "Run tests (no torch: local-model tests are skipped)"
        run: pytest -q

  test-local:
    name: test (with local models, torch + captum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache HuggingFace model downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-all-MiniLM-L6-v2

      - name: Install package + local extras + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[local,viz]" pytest

      - name: Run full test suite (exercises gradient/maxsim/local-model paths)
        run: pytest -q

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache HuggingFace model downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-all-MiniLM-L6-v2

      - name: Install package + local extras + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[local,viz,dev]"

      - name: Run tests with coverage
        run: pytest -q --cov=whymatched --cov-report=term-missing --cov-report=xml

      - name: Generate coverage badge
        run: coverage-badge -o coverage.svg -f

      - name: Commit updated badge (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- coverage.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add coverage.svg
            git commit -m "chore: update coverage badge [skip ci]"
            git push
          fi
